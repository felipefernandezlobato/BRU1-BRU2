services:
  - type: web
    name: bru1-bru2-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Read-only connection to the Escandallos Neon DB, used by the cost sync.
      # Set in the Render dashboard; the API boots fine without it and the sync
      # returns a 400 until it is present.
      - key: ESCANDALLOS_DATABASE_URL
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
